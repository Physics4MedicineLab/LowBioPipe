name: lowbiopipe
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Core (versions tested together; see README)
  - python=3.12
  - nextflow=26.04.6

  # Data processing
  - pandas=3.0.6
  - numpy=2.5.3

  # Bioinformatics
  - conda-forge::scikit-bio=0.7.4
  - bioconda::recentrifuge=2.1.2

  # Data analysis
  - scipy=1.18.1

  # Visualization
  - matplotlib-base=3.11.2
  - seaborn=0.13.2

  # File handling
  - openpyxl=3.1.5
